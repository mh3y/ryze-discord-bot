name: Deploy to OCI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.13.52.6
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            BOT_DIR=/opt/ryze/ryze-discord-bot

            echo "==> Pulling latest code..."
            cd "$BOT_DIR"

            # Wire up GitHub remote if not already set
            if ! git remote get-url origin &>/dev/null 2>&1; then
              git remote add origin https://github.com/mh3y/ryze-discord-bot.git
            fi

            git fetch origin master
            git reset --hard origin/master

            echo "==> Rebuilding bot container..."
            docker compose build bot

            echo "==> Restarting bot..."
            docker compose up -d --no-deps bot

            echo "==> Done. Showing last 20 lines of logs..."
            sleep 3
            docker compose logs bot --tail=20
