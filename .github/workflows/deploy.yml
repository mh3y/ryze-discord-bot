name: Deploy to OCI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BOT_ENV: ${{ secrets.BOT_ENV }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          timeout: 120s
          envs: GH_PAT,BOT_ENV,DB_PASSWORD
          script: |
            set -e
            BOT_DIR=/opt/ryze/ryze-discord-bot
            REPO=https://x-access-token:${GH_PAT}@github.com/mh3y/ryze-discord-bot.git

            echo "==> Pulling latest code..."

            # Clone fresh if the directory isn't a git repo yet
            if [ ! -d "$BOT_DIR/.git" ]; then
              echo "    (first run — cloning repo into $BOT_DIR)"
              sudo mkdir -p "$(dirname "$BOT_DIR")"
              sudo chown ubuntu:ubuntu "$(dirname "$BOT_DIR")"
              # If a non-git directory already exists, move it aside so git can clone
              if [ -d "$BOT_DIR" ]; then
                sudo mv "$BOT_DIR" "${BOT_DIR}.bak.$(date +%s)"
              fi
              git clone "$REPO" "$BOT_DIR"
            fi

            cd "$BOT_DIR"
            git fetch "$REPO" master
            git reset --hard FETCH_HEAD

            echo "==> Writing .env file..."
            printf '%s' "$BOT_ENV" > "$BOT_DIR/.env"
            # Append DB_PASSWORD (managed as its own secret, not inside BOT_ENV)
            printf '\nDB_PASSWORD=%s\n' "$DB_PASSWORD" >> "$BOT_DIR/.env"
            chmod 600 "$BOT_DIR/.env"

            echo "==> Rebuilding bot container..."
            docker compose build bot

            echo "==> Restarting bot..."
            docker compose up -d --no-deps bot

            echo "==> Done. Showing last 20 lines of logs..."
            sleep 3
            docker compose logs bot --tail=20
